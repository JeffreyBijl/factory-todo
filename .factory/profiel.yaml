# Projectprofiel van de software factory
#
# Zonder goedgekeurd profiel bouwt de factory niets.
# De factory stelt wijzigingen voor; alleen de mens keurt ze goed en verhoogt de versie.

schema: 1
versie: 2
goedgekeurd:
  door: "Jeffrey Bijl"
  op: "2026-10-12"
project:
  naam: "factory-todo"
  repo: "JeffreyBijl/factory-todo"
  omschrijving: "Todo-lijst in de browser (toevoegen, afvinken, verwijderen) voor persoonlijk gebruik"

# --- Verplicht vóór bouwen ---

commandos:
  installeren: "npm ci"
  bouwen: "npm run build"
  testen: "npm test"
  e2e: "npm run e2e"
  linten: "npm run lint"
  formatteren: "npm run format"
  formattering_controleren: "npm run format:check"
  lokaal_draaien: "npm run build && npm start"
  gecontroleerd_op: "2026-10-11"

stack:
  taal: "TypeScript 6.0 op Node 24 (devcontainer: Node 22, minimaal 22.18)"
  framework: "Angular 22 (zoneless, geen SSR) met een Node-server op node:http"
  database: "SQLite via node:sqlite (ingebouwd), pad via DB_PATH"
  testtools:
    unit: "Vitest (Angular via ng test, server via vitest run)"
    e2e: "Playwright"
  formatter: "Prettier met tabs"

# Officiële hulp per onderdeel van de stack; alleen wat de mens heeft goedgekeurd, met reden.
stackkennis:
  - onderdeel: "Angular 22"
    waarom: "Angular 22 is nieuwer dan veel trainingsdata (OnPush standaard, Signal Forms, @Service); de best practices en de documentatie komen van het Angular-team voor deze versie"
    mcp:
      naam: "stack-angular"
      commando: "npx ng mcp --read-only"
      domeinen: [angular.dev, L1XWT2UJ7F-dsn.algolia.net]
    regels: [CLAUDE.md]
    documentatie: "https://angular.dev, versie 22"
  - onderdeel: "TypeScript 6 op Node 22/24, server op node:http"
    waarom: "geen officiële AI-hulp die iets toevoegt; de agents gebruiken de documentatie van de versie in het project"
    documentatie: "https://www.typescriptlang.org/docs/ en https://nodejs.org/docs/latest-v22.x/api/"
  - onderdeel: "SQLite via node:sqlite"
    waarom: "geen officiële AI-hulp; node:sqlite is nieuw, dus de agents volgen de Node-documentatie"
    documentatie: "https://nodejs.org/docs/latest-v22.x/api/sqlite.html"
  - onderdeel: "Vitest 5"
    waarom: "geen officiële AI-hulp; de agents gebruiken de documentatie van de versie in de lockfile"
    documentatie: "https://vitest.dev"
  - onderdeel: "Playwright 1.64"
    waarom: "de plugin van Microsoft voegt niets toe: de evaluator gebruikt Playwright uit het project"
    documentatie: "https://playwright.dev/docs/intro"

# Map met de tests van de testagent; valt onder de test-ratchet en CODEOWNERS.
# unit/ (Angular, *.spec.ts), server/ (API, *.test.ts), e2e/ (Playwright, *.spec.ts)
testmap: "tests/factory/"

# Paden die geen enkele agent wijzigt. Aanvullen mag, schrappen niet.
verboden_terrein:
  - .github/
  - .devcontainer/
  - .factory/profiel.yaml
  - CLAUDE.md
  - .mcp.json
  - .claude/
  - Dockerfile
  - .dockerignore

# Delen waar security altijd meekijkt en die bovenaan in de PR komen.
gevoelige_gebieden:
  - pad: "server/**"
    reden: "publieke API zonder authenticatie of rate limiting, en bestandsserving uit dist/"
  - pad: "server/db.ts"
    reden: "databaseschema en queries (SQLite)"
  - pad: "proxy.conf.json"
    reden: "bepaalt waar de frontend zijn API-verzoeken heen stuurt"
  - pad: "package.json"
    reden: "dependencies en scripts die in CI en de preview draaien"

grenzen:
  max_rondes: 3
  max_rondes_zonder_voortgang: 2
  max_testconflicten: 3
  pr_alarm:
    regels: 400
    bestanden: 15
  verbruik_alarm: "30% van het weeklimiet per slice"

# Security is altijd verplicht.
specialisten:
  verplicht: [security, ui, ux]
  optioneel: [backend, database, evaluator]

# --- Groeit mee ---

conventies: []

model_per_rol:
  spec-schrijver: { model: opus, effort: high }
  security: { model: opus, effort: high }
  testagent: { model: sonnet, effort: medium }
  bouwer: { model: sonnet, effort: medium }
  eenvoudige-checks: { model: haiku, effort: low }

# Alleen namen, nooit waarden.
omgevingen: {}

wijzigingen:
  - versie: 1
    op: "2026-10-11"
    wat: "Eerste profiel na de kennismaking"
  - versie: 2
    op: "2026-10-12"
    wat: "Stackkennis toegevoegd (Angular: CLAUDE.md en MCP-server stack-angular met zoeken in de documentatie); .mcp.json en .claude/ op verboden terrein"
