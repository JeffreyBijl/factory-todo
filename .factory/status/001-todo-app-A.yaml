dekking:
  - criterium: AC-1
    test: "tests/factory/e2e/slice-a.spec.ts::AC-1: een lege lijst toont \"Nog niets te doen.\" en geen listitem"
    status: groen
  - criterium: AC-2
    test: "tests/factory/e2e/slice-a.spec.ts::AC-2: Melk kopen toevoegen met Enter toont één listitem, leegt het veld en verbergt de lege tekst"
    status: groen
  - criterium: AC-3
    test: "tests/factory/e2e/slice-a.spec.ts::AC-3: toevoegen met de knop zet nieuwe todos onderaan"
    status: groen
  - criterium: AC-4
    test: "tests/factory/e2e/slice-a.spec.ts::AC-4: na herladen staan Melk kopen en Brood er nog, in dezelfde volgorde"
    status: groen
  - criterium: AC-5
    test: "tests/factory/e2e/slice-a.spec.ts::AC-5: drie spaties toevoegen geeft geen listitem, ook niet na herladen"
    status: groen
  - criterium: AC-6
    test: "tests/factory/e2e/slice-a.spec.ts::AC-6: <b>vet</b> wordt letterlijk getoond en niet als b-element"
    status: groen
  - criterium: AC-7
    test: "tests/factory/unit/slice-a.spec.ts::AC-7: het invoerveld \"Nieuwe taak\" heeft maxlength=\"200\""
    status: groen
  - criterium: AC-8
    test: "tests/factory/e2e/slice-a.spec.ts::AC-8: een mislukte POST toont een alert, houdt de invoer en voegt niets toe"
    status: rood
  - criterium: AC-9
    test: "tests/factory/e2e/slice-a.spec.ts::AC-9: na een geslaagde nieuwe poging is de alert weg en staat Melk kopen in de lijst"
    status: rood
  - criterium: AC-10
    test: "tests/factory/e2e/slice-a.spec.ts::AC-10: een mislukte GET toont \"Laden mislukt\" en niet \"Nog niets te doen.\""
    status: rood
  - criterium: AC-11
    test: "tests/factory/server/slice-a.test.ts::AC-11: een lege database geeft 200 en []; daarna staan beide todos in volgorde van aanmaken"
    status: groen
  - criterium: AC-12
    test: "tests/factory/server/slice-a.test.ts::AC-12: POST met spaties rond de titel geeft 201 met getrimde titel, gedaan false en een geheel getal als id"
    status: groen
  - criterium: AC-13
    test: "tests/factory/server/slice-a.test.ts::AC-13: weigert met 400 en laat de lijst leeg (5 varianten)"
    status: groen
  - criterium: AC-14
    test: "tests/factory/server/slice-a.test.ts::AC-14: een titel van precies 200 tekens geeft 201 en wordt volledig opgeslagen"
    status: groen
  - criterium: AC-44
    test: "tests/factory/server/slice-a.test.ts::AC-44: een body van 10 240 bytes mag, 10 241 bytes en 20 000 bytes chunked geven 413 en veranderen niets"
    status: rood

