schema: 1
spec: "001-todo-app"
spec_versie: 1
slice: "A"
gedrag: "De gebruiker voegt een todo met een titel toe, ziet hem onderaan de lijst en ziet een melding als laden of toevoegen mislukt; de API weigert een te grote body."
profielversie: 2
branch: "factory/001-todo-app-a"
bijgewerkt: "2026-10-12T13:15"

fase: tests
ronde: 3
testconflicten: 1
wacht_op_mens: null

volgende_stap: "testagent past het importpad van TodoService in tests/factory/unit/slice-a.spec.ts aan naar src/app/todos/todo.service; daarna bouwer verplaatst de service (ronde 3); daarna review ronde 3 door security, ui en ux"
resterend_werk:
  - "B-6: Angular-app opdelen in componenten met een betere architectuur en mappenstructuur, volgens de Angular-22-standaarden (stackkennis)"

tests:
  commit: "081d84e"
  aantal: 15

dekking:
  - criterium: AC-1
    test: "tests/factory/e2e/slice-a.spec.ts::AC-1: een lege lijst toont \"Nog niets te doen.\" en geen listitem"
    status: groen
  - criterium: AC-2
    test: "tests/factory/e2e/slice-a.spec.ts::AC-2: Melk kopen toevoegen met Enter toont één listitem, leegt het veld en verbergt de lege tekst"
    status: groen
  - criterium: AC-3
    test: "tests/factory/e2e/slice-a.spec.ts::AC-3: toevoegen met de knop zet nieuwe todos onderaan"
    status: groen
  - criterium: AC-4
    test: "tests/factory/e2e/slice-a.spec.ts::AC-4: na herladen staan Melk kopen en Brood er nog, in dezelfde volgorde"
    status: groen
  - criterium: AC-5
    test: "tests/factory/e2e/slice-a.spec.ts::AC-5: drie spaties toevoegen geeft geen listitem, ook niet na herladen"
    status: groen
  - criterium: AC-6
    test: "tests/factory/e2e/slice-a.spec.ts::AC-6: <b>vet</b> wordt letterlijk getoond en niet als b-element"
    status: groen
  - criterium: AC-7
    test: "tests/factory/unit/slice-a.spec.ts::AC-7: het invoerveld \"Nieuwe taak\" heeft maxlength=\"200\""
    status: groen
  - criterium: AC-8
    test: "tests/factory/e2e/slice-a.spec.ts::AC-8: een mislukte POST toont een alert, houdt de invoer en voegt niets toe"
    status: groen
  - criterium: AC-9
    test: "tests/factory/e2e/slice-a.spec.ts::AC-9: na een geslaagde nieuwe poging is de alert weg en staat Melk kopen in de lijst"
    status: groen
  - criterium: AC-10
    test: "tests/factory/e2e/slice-a.spec.ts::AC-10: een mislukte GET toont \"Laden mislukt\" en niet \"Nog niets te doen.\""
    status: groen
  - criterium: AC-11
    test: "tests/factory/server/slice-a.test.ts::AC-11: een lege database geeft 200 en []; daarna staan beide todos in volgorde van aanmaken"
    status: groen
  - criterium: AC-12
    test: "tests/factory/server/slice-a.test.ts::AC-12: POST met spaties rond de titel geeft 201 met getrimde titel, gedaan false en een geheel getal als id"
    status: groen
  - criterium: AC-13
    test: "tests/factory/server/slice-a.test.ts::AC-13: weigert met 400 en laat de lijst leeg (5 varianten)"
    status: groen
  - criterium: AC-14
    test: "tests/factory/server/slice-a.test.ts::AC-14: een titel van precies 200 tekens geeft 201 en wordt volledig opgeslagen"
    status: groen
  - criterium: AC-44
    test: "tests/factory/server/slice-a.test.ts::AC-44: een body van 10 240 bytes mag, 10 241 bytes en 20 000 bytes chunked geven 413 en veranderen niets"
    status: groen

bevindingen:
  - id: B-1
    specialist: ui
    niveau: blokkerend
    ronde: 1
    wat: "Een lange titel zonder spaties (200 tekens, geldige invoer volgens AC-14) laat de pagina op 375 px horizontaal scrollen (scrollWidth 2363 px) en duwt de knop Verwijderen buiten beeld."
    waar: "src/app/app.css:44"
    status: opgelost
    oplossing: "li label flex 1 en min-width 0, titel overflow-wrap anywhere, knop flex-shrink 0 (158cdf7); door de orchestrator nagemeten op 375 px: scrollWidth 375, knop Verwijderen op x 315, 44x44 px"
  - id: B-2
    specialist: ui
    niveau: advies
    ronde: 1
    wat: "Aanraakdoelen kleiner dan 44 bij 44 px (verwijderknop 41x39, Toevoegen 106x38)."
    waar: "src/app/app.css:15, src/app/app.html:31-37"
    status: opgelost
    oplossing: "knoppen min 44x44 px, checkbox 1.5rem, li label min-height 44 px (158cdf7)"
  - id: B-3
    specialist: ui
    niveau: advies
    ronde: 1
    wat: "Tijdens het laden is niets te zien; voorstel: <p role=\"status\">Laden…</p> zolang niet geladen en geen fout."
    waar: "src/app/app.html:21-22"
    status: opgelost
    oplossing: "'Laden…' met role status zolang niet geladen en geen fout (158cdf7)"
  - id: B-4
    specialist: ui
    niveau: advies
    ronde: 1
    wat: "Contrast #777 op #fafafa ongeveer 4,3:1 (berekend), onder WCAG 4,5:1, voor 'Nog niets te doen.' en afgevinkte titels."
    waar: "src/app/app.css:50-56"
    status: opgelost
    oplossing: "grijs #777 vervangen door #666, circa 5,4:1 (158cdf7)"
  - id: B-5
    specialist: ux
    niveau: notitie
    ronde: 1
    wat: "Mislukt het herladen na een geslaagde toevoeging, dan staat de todo wel op de server maar ziet de gebruiker 'Laden mislukt' en de todo niet; herladen herstelt het."
    waar: "src/app/app.ts:37-41"
    status: open
    oplossing: ""
  - id: B-6
    specialist: mens
    niveau: blokkerend
    ronde: 3
    wat: "Review van Jeffrey Bijl op PR #2 (changes requested): de structuur van de Angular-app is niet goed; er moeten verschillende componenten komen en de architectuur en mappenstructuur moeten beter, volgens de nieuwe Angular-standaarden uit de MCP-server stack-angular."
    waar: "src/app/"
    status: open
    oplossing: ""

beslissingen:
  - "Tijdens het laden toont de lijst niets (ook niet \"Nog niets te doen.\"), zodat bij een mislukte GET alleen \"Laden mislukt\" staat (AC-10). Afgeleid uit de diff, niet uit een resultaatblok."
  - "Body-limiet als uitzondering in leesJson, afgevangen in behandelApi: status 413 met connection: close. Afgeleid uit de diff."
  - "B-1 (ronde 2): li label flex 1 en min-width 0, titel overflow-wrap anywhere, knop flex-shrink 0, zodat lange titels afbreken en de knop zichtbaar blijft."
  - "B-2 (ronde 2): knoppen min-width en min-height 44 px, checkbox 1.5rem, li label min-height 44 px."
  - "B-3 (ronde 2): tijdens laden 'Laden…' met role status, alleen zolang er geen fout is; bij een mislukte GET staat alleen de alert (AC-10)."
  - "B-4 (ronde 2): grijs #777 vervangen door #666."
  - "B-5 is een notitie en niet opgelost."

