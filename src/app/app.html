<main>
	<h1>Todo</h1>

	<app-nieuwe-taak />

	@if (store.fout()) {
		<app-foutmelding [bericht]="store.fout()" />
	}

	<app-todo-lijst
		[todos]="store.todos()"
		[geladen]="store.geladen()"
		[heeftFout]="!!store.fout()"
		(gewisseld)="store.wissel($event)"
		(verwijderd)="store.verwijder($event)"
	/>
</main>
